{% extends "base.html" %}
{% block title %}登录 - 医院门诊系统{% endblock %}
{% block content %}
<div class="login-panel">
  <div class="login-copy">
    <div class="eyebrow">HIS · OUTPATIENT</div>
    <h1>医院门诊管理系统</h1>
    <p>对标小型 HIS 门诊业务：患者档案、挂号、医生排班、处方开具、收费退费一体化后台。</p>
    <div class="hint-box">
      <strong>测试账号（密码均为 123456）</strong>
      <p>admin01 管理员 / doctor01 医生 / reg01 挂号员 / cash01 收费员</p>
    </div>
  </div>
  <form class="form-card login-form" method="post">
    <h2>账号登录</h2>
    <label>用户名
      <input name="username" placeholder="例如 admin01" required autofocus>
    </label>
    <label>密码
      <input name="password" type="password" placeholder="123456" required>
    </label>
    <button type="submit" style="width:100%">登 录</button>
  </form>
</div>
{% endblock %}
