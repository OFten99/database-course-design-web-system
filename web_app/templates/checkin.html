{% extends "base.html" %}
{% block title %}办理入住 - 酒店人事系统{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">Check-in</p>
    <h1>办理入住</h1>
    <p>订单号推荐格式：<code>ORD + 年月日时分秒</code>，例如 <code>{{ suggested_order_no }}</code>。客房只能选择空闲房。</p>
  </div>
</section>

<form class="form-card wide-form" method="post">
  <div class="form-grid">
    <label>订单号
      <input name="order_no" value="{{ suggested_order_no }}" required>
    </label>
    <label>客户
      <select name="customer_id" required>
        {% for item in customers %}
        <option value="{{ item.customer_id }}">{{ item.customer_id }} - {{ item.customer_name }}（{{ item.phone }}）</option>
        {% endfor %}
      </select>
    </label>
    <label>空闲客房
      <select name="room_id" required>
        {% for item in rooms %}
        <option value="{{ item.room_id }}">{{ item.room_id }} - {{ item.room_no }} / {{ item.type_name }} / {{ item.standard_price }} 元</option>
        {% endfor %}
      </select>
    </label>
    <label>前台员工
      <select name="receptionist_id" required>
        {% for item in receptionists %}
        <option value="{{ item.employee_id }}">{{ item.employee_id }} - {{ item.employee_name }}（{{ item.employee_no }}）</option>
        {% endfor %}
      </select>
    </label>
    <label>预计退房时间
      <input name="expected_checkout_time" placeholder="2026-07-15 12:00:00" required>
    </label>
    <label>成交房价
      <input name="room_price" type="number" step="0.01" placeholder="298.00" required>
    </label>
    <label>押金金额
      <input name="deposit_amount" type="number" step="0.01" placeholder="500.00" required>
    </label>
  </div>
  <button type="submit">提交入住</button>
  <p class="form-tip">入住成功后，数据库会把对应客房状态改为“入住”。</p>
</form>
{% endblock %}
